<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles/WEBPAGE2.css" />
  </head>
  <body>
    <!--This is a comment-->
    <div class="form-container">
      <form>
        <h2 align="center">Create an account</h2>
        <input
          type="text"
          id="fname"
          name="fname"
          placeholder="First Name"
          required
        />
        <input
          type="text"
          id="lname"
          name="lname"
          placeholder="Last Name"
          required
        />
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Email"
          required
        />
        <input
          type="password"
          id="pwd"
          name="pwd"
          placeholder="Password"
          required
        />
      </form>
      <center/>
        <button
          type="submit"
          onclick="location.href='http://species-in-pieces.com/'"
        >
          Sign Up
        </button>
    </div>
  </body>
</html>
