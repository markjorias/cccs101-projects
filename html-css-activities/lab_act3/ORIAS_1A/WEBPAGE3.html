<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiktok Sign Up</title>
    <link rel="stylesheet" href="WEBPAGE3.css">
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="title">
                <h1>Log in to Tiktok</h1>
                <p>Manage your account, check notifications, <br> comment on videos, and more.</p>
            </div>
            <div>
                <button type="submit">
                    <img src="https://img.icons8.com/pastel-glyph/64/gender-neutral-user.png" alt="gender-neutral-user"/> 
                    <div class="button-content">Use phone / email / username</div>
                </button>
                <button type="submit">
                    <img src="https://img.icons8.com/fluency/48/facebook-new.png" alt="facebook-new"/> 
                    <div class="button-content">Log in with Facebook</div>
                </button>
                <button type="submit">
                    <img src="https://img.icons8.com/color/48/google-logo.png" alt="google-logo"/>
                    <div class="button-content">Log in with Google</div>
                </button>
                <button type="submit">
                    <img src="https://img.icons8.com/color/48/twitter--v1.png" alt="twitter--v1"/>
                    <div class="button-content">Log in with Twitter</div>
                </button>
                <button type="submit">
                    <img src="https://img.icons8.com/ios-glyphs/30/mac-os.png" alt="mac-os"/>
                    <div class="button-content">Log in with Apple</div>
                </button>
                <button type="submit">
                    <img src="https://img.icons8.com/fluency/48/instagram-new.png" alt="instagram-new"/>
                    <div class="button-content">Log in with Instagram</div>
                </button>
            </div>
    </div>
</body>
</html>
